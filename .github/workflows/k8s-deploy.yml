name: Build and Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service name (or all to release every service)
        required: true
        default: all
        type: choice
        options:
          - all
          - gateway
          - gate-server
          - computing
          - user
          - item
          - commerce
          - ws-gateway
          - order
          - pay
          - promotion
          - xds
      image_tag:
        description: Version to build and deploy (e.g. 0.0.2)
        required: true
        type: string

concurrency:
  group: one-adventure-k8s
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: 15342537816/one_adventure_backend
  KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'one-adventure' }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  DEPLOY_SERVICE: ${{ inputs.service || 'all' }}
  MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || '' }}
  REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate release selection
        run: |
          set -euo pipefail
          case "$DEPLOY_SERVICE" in
            all|gateway|gate-server|computing|user|item|commerce|ws-gateway|order|pay|promotion|xds) ;;
            *) echo "Unknown service: $DEPLOY_SERVICE" >&2; exit 2 ;;
          esac
          [[ "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ && ${#IMAGE_TAG} -le 116 ]] || { echo 'Invalid image version' >&2; exit 2; }

      - name: Verify runner tools
        run: |
          set -euo pipefail
          command -v docker
          docker compose version
          command -v kubectl
          command -v go
          command -v python3
          python3 -c 'import yaml'

      - name: Install GoFrame CLI
        run: |
          set -euo pipefail
          if ! command -v gf >/dev/null 2>&1; then
            GOBIN="$RUNNER_TEMP/bin" go install github.com/gogf/gf/v2/cmd/gf@v2.10.3
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Login to Docker Hub
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USERNAME" || { echo 'Missing REGISTRY_USERNAME secret' >&2; exit 1; }
          test -n "$REGISTRY_PASSWORD" || { echo 'Missing REGISTRY_PASSWORD secret' >&2; exit 1; }
          echo "$REGISTRY_PASSWORD" | docker login --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build, push and deploy
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/git_actions/k8s/deploy-runner.sh" \
            --docker-config "$HOME/.docker/config.json" \
            "$IMAGE_REPOSITORY" "$IMAGE_TAG"

      - name: Show deployed workloads
        if: always()
        run: kubectl get deployments,pods,svc,pvc -n "$KUBE_NAMESPACE" -o wide
