name: Build and Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service name (or all to release every service)
        required: true
        default: all
        type: choice
        options:
          - all
          - gateway
          - gate-server
          - computing
          - user
          - item
          - commerce
          - ws-gateway
          - order
          - pay
          - promotion
          - xds
      image_tag:
        description: Version to build and deploy (e.g. 0.0.2)
        required: true
        type: string
      deploy_only:
        description: Only deploy existing images (skip compilation, image build and push)
        required: true
        default: false
        type: boolean
      deploy_observability:
        description: Apply and wait for Loki, Tempo and Grafana during a full deployment (unchecked leaves existing resources untouched)
        required: true
        default: true
        type: boolean

concurrency:
  group: one-adventure-k8s
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: 15342537816/one_adventure_backend
  KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'one-adventure' }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  ROLLOUT_TIMEOUT_SECONDS: ${{ vars.ROLLOUT_TIMEOUT_SECONDS || '300' }}
  PVC_TIMEOUT_SECONDS: ${{ vars.PVC_TIMEOUT_SECONDS || '120' }}
  STORAGE_NODE_NAME: ${{ vars.STORAGE_NODE_NAME || '' }}
  DEPLOY_SERVICE: ${{ inputs.service || 'all' }}
  MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || '' }}
  REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || '' }}

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Initialize temporary Docker config
        run: |
          set -euo pipefail
          registry_config_dir=$(mktemp -d "$RUNNER_TEMP/one-adventure-docker.XXXXXX")
          echo "DOCKER_CONFIG=$registry_config_dir" >> "$GITHUB_ENV"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate release selection
        run: |
          set -euo pipefail
          case "$DEPLOY_SERVICE" in
            all|gateway|gate-server|computing|user|item|commerce|ws-gateway|order|pay|promotion|xds) ;;
            *) echo "Unknown service: $DEPLOY_SERVICE" >&2; exit 2 ;;
          esac
          [[ "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ && ${#IMAGE_TAG} -le 116 ]] || { echo 'Invalid image version' >&2; exit 2; }

      - name: Verify runner tools
        run: |
          set -euo pipefail
          command -v docker
          command -v kubectl
          command -v python3
          python3 -c 'import yaml'

      - name: Verify build tools
        if: ${{ !inputs.deploy_only }}
        run: |
          set -euo pipefail
          command -v go
          docker compose version

      - name: Install GoFrame CLI
        if: ${{ !inputs.deploy_only }}
        run: |
          set -euo pipefail
          if ! command -v gf >/dev/null 2>&1; then
            GOBIN="$RUNNER_TEMP/bin" go install github.com/gogf/gf/v2/cmd/gf@v2.10.3
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Login to Docker Hub
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_USERNAME" || { echo 'Missing REGISTRY_USERNAME secret' >&2; exit 1; }
          test -n "$REGISTRY_PASSWORD" || { echo 'Missing REGISTRY_PASSWORD secret' >&2; exit 1; }
          install -d -m 700 "$DOCKER_CONFIG"
          echo "$REGISTRY_PASSWORD" | docker login --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build, push and deploy
        timeout-minutes: 45
        env:
          DEPLOY_ONLY: ${{ inputs.deploy_only }}
          DEPLOY_OBSERVABILITY: ${{ inputs.deploy_observability }}
        run: |
          set -euo pipefail
          args=(--local-storage --docker-config "$DOCKER_CONFIG/config.json")
          if [[ "$DEPLOY_OBSERVABILITY" != true ]]; then
            args+=(--skip-observability)
          fi
          if [[ "$DEPLOY_ONLY" == true ]]; then
            args+=(--deploy-only)
            echo "Deploy existing images: $DEPLOY_SERVICE / $IMAGE_TAG"
          fi
          bash "$GITHUB_WORKSPACE/deploy/git_actions/k8s/deploy-runner.sh" \
            "${args[@]}" \
            "$IMAGE_REPOSITORY" "$IMAGE_TAG"

      - name: Show deployed workloads
        if: always()
        timeout-minutes: 1
        run: kubectl --request-timeout=20s get deployments,statefulsets,pods,svc,pvc -n "$KUBE_NAMESPACE" -o wide

      - name: Remove temporary registry credentials
        if: always()
        run: |
          if [[ -n "${DOCKER_CONFIG:-}" ]]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi
