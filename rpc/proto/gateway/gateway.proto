syntax = "proto3";

package gateway;	//声明包为proto

option go_package = "one_adventure_rpc/proto/gateway;gateway";

// 定义消息格式
message RegisterReq {
  string type = 1;      // 注册类型
  string ip = 2;        // ip信息
  int32 port=3;         //连接端口信息
  int64 register_time = 4;  // 注册时间戳 ms
  string version = 5;   //版本
  int32 weight = 6;    //权重
  string instance_id = 7;        //实例id
  string registration_token = 8; // 本轮注册唯一标识
}

message RegisterResp {
  int32 code=1;     //响应码
  string message=2;
  int64 ping_interval_ms = 3; // Gateway 调用微服务 Ping 的周期
  int64 lease_duration_ms = 4; // 微服务未收到 Gateway Ping 后重新注册的等待时间
}

// 定义服务接口
service GatewayService {
  rpc RegisterGateway (RegisterReq) returns (RegisterResp);
}
