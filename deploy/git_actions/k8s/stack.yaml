apiVersion: v1
kind: Service
metadata:
  name: etcd-headless
  namespace: __KUBE_NAMESPACE__
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: etcd}
  ports: [{name: client, port: 2379, targetPort: 2379}]
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: __KUBE_NAMESPACE__
spec:
  selector: {app: etcd}
  ports: [{name: client, port: 2379, targetPort: 2379}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 1
  serviceName: etcd-headless
  selector: {matchLabels: {app: etcd}}
  template:
    metadata: {labels: {app: etcd}}
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.18
          args: [/usr/local/bin/etcd, --advertise-client-urls=http://0.0.0.0:2379, --listen-client-urls=http://0.0.0.0:2379]
          ports: [{containerPort: 2379}]
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: __KUBE_NAMESPACE__
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: kafka}
  ports:
    - {name: controller, port: 9093, targetPort: 9093}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: __KUBE_NAMESPACE__
spec:
  # KRaft must reach the controller listener before the broker readiness probe
  # can pass; publish the endpoint during startup to avoid a boot deadlock.
  publishNotReadyAddresses: true
  selector: {app: kafka}
  ports:
    - {name: kafka, port: 9092, targetPort: 9092}
    - {name: controller, port: 9093, targetPort: 9093}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 1
  serviceName: kafka-headless
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: prepare-data
          image: apache/kafka:3.9.1
          command: [bash, -ec]
          args:
            - |
              # Local PVs are mounted as root after a node reboot. Kafka needs
              # ownership of every existing file before it opens the log.
              mkdir -p /var/lib/kafka/data
              chown -R 1000:1000 /var/lib/kafka/data
          securityContext: {runAsUser: 0}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          command: [/bin/bash, -ec]
          args:
            - |
              # Formatting is a one-time operation. Re-running format during
              # every pod restart can fail against an already initialized log
              # directory and prevent the broker from starting.
              if [[ ! -f /var/lib/kafka/data/meta.properties ]]; then
                /opt/kafka/bin/kafka-storage.sh format \
                  --ignore-formatted \
                  --cluster-id MkU3OEVBNTcwNTJENDM2Qk \
                  --config /etc/kafka/server.properties
              fi
              exec /opt/kafka/bin/kafka-server-start.sh /etc/kafka/server.properties
          ports: [{name: kafka, containerPort: 9092}, {name: controller, containerPort: 9093}]
          readinessProbe:
            tcpSocket: {port: kafka}
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 120
          volumeMounts:
            - {name: config, mountPath: /etc/kafka/server.properties, subPath: server.properties, readOnly: true}
            - {name: data, mountPath: /var/lib/kafka/data}
      volumes:
        - {name: config, configMap: {name: kafka-config}}
        - {name: data, persistentVolumeClaim: {claimName: kafka-data}}
---
apiVersion: v1
kind: Service
metadata:
  name: xds
  namespace: __KUBE_NAMESPACE__
spec:
  selector: {app: xds}
  ports: [{name: xds, port: 18000, targetPort: 18000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xds
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 1
  selector: {matchLabels: {app: xds}}
  template:
    metadata: {labels: {app: xds}}
    spec:
      containers:
        - name: xds
          image: __IMAGE_REPOSITORY__:xds-__XDS_IMAGE_TAG__
          imagePullPolicy: Always
          env: [{name: XDS_CONFIG, value: /app/config.yaml}, {name: ETCD_ENDPOINTS, value: etcd:2379}]
          ports: [{containerPort: 18000}]
          volumeMounts: [{name: config, mountPath: /app/config.yaml, subPath: config.yaml}]
      volumes: [{name: config, secret: {secretName: xds-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: __KUBE_NAMESPACE__
spec:
  type: NodePort
  selector: {app: gateway}
  ports: [{name: http, port: 8901, targetPort: 8901, nodePort: 30901}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      hostAliases:
        - ip: "__HOST_GATEWAY_IP__"
          hostnames: [host.docker.internal]
      containers:
        - name: gateway
          image: __IMAGE_REPOSITORY__:gateway-__IMAGE_TAG__
          env: [{name: ETCD_ENDPOINTS, value: etcd:2379}]
          ports: [{containerPort: 8901}]
          volumeMounts: [{name: config, mountPath: /app/config}]
      volumes: [{name: config, secret: {secretName: gateway-config}}]
