apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: __KUBE_NAMESPACE__
data:
  01-databases.sql: |
    CREATE DATABASE IF NOT EXISTS test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS one_adventure_user CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS one_adventure_item CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS one_adventure_commerce CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS one_adventure_server CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: __KUBE_NAMESPACE__
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: __KUBE_NAMESPACE__
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: __KUBE_NAMESPACE__
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: __KUBE_NAMESPACE__
spec:
  selector: {app: mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 1
  serviceName: mysql-headless
  selector: {matchLabels: {app: mysql}}
  template:
    metadata: {labels: {app: mysql}}
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: middleware-auth, key: mysql-root-password}
            - {name: MYSQL_ROOT_HOST, value: "%"}
          ports: [{name: mysql, containerPort: 3306}]
          startupProbe:
            exec:
              command: [sh, -ec, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: [sh, -ec, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: mysql}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql, subPath: mysql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: mysql-data}}
        - {name: init, configMap: {name: mysql-init}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: __KUBE_NAMESPACE__
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: __KUBE_NAMESPACE__
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: __KUBE_NAMESPACE__
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 1
  serviceName: redis-headless
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: [sh, -ec]
          args:
            - 'exec redis-server --appendonly yes --requirepass "$REDISCLI_AUTH"'
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: {name: middleware-auth, key: redis-password}
          ports: [{name: redis, containerPort: 6379}]
          startupProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: redis-data}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: __KUBE_NAMESPACE__
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: __KUBE_NAMESPACE__
data:
  local-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      filesystem:
        directory: /loki/chunks
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
    limits_config:
      allow_structured_metadata: false
      volume_enabled: true
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: __KUBE_NAMESPACE__
spec:
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 1
  serviceName: loki-headless
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:3.5.0
        args:
        - -config.file=/etc/loki/local-config.yaml
        ports:
        - name: http
          containerPort: 3100
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 15
        volumeMounts:
        - name: config
          mountPath: /etc/loki
          readOnly: true
        - name: data
          mountPath: /loki
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          failureThreshold: 120
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: data
        persistentVolumeClaim:
          claimName: loki-data
      securityContext:
        fsGroup: 10001
      initContainers:
      - name: prepare-data
        image: busybox:1.37.0
        command:
        - sh
        - -ec
        - chown -R 10001:10001 /data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  namespace: __KUBE_NAMESPACE__
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: __KUBE_NAMESPACE__
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/blocks
        wal:
          path: /var/tempo/wal
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 48h
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: __KUBE_NAMESPACE__
spec:
  selector:
    app: tempo
  ports:
  - name: http
    port: 3200
    targetPort: http
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 1
  serviceName: tempo-headless
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
      - name: tempo
        image: grafana/tempo:2.7.2
        args:
        - -config.file=/etc/tempo/tempo.yaml
        ports:
        - name: http
          containerPort: 3200
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 15
        volumeMounts:
        - name: config
          mountPath: /etc/tempo
          readOnly: true
        - name: data
          mountPath: /var/tempo
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          failureThreshold: 120
      volumes:
      - name: config
        configMap:
          name: tempo-config
      - name: data
        persistentVolumeClaim:
          claimName: tempo-data
      securityContext:
        fsGroup: 10001
      initContainers:
      - name: prepare-data
        image: busybox:1.37.0
        command:
        - sh
        - -ec
        - chown -R 10001:10001 /data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: __KUBE_NAMESPACE__
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: http
    nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.5.2
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GF_METRICS_ENABLED
          value: 'true'
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
          failureThreshold: 120
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
      securityContext:
        fsGroup: 472
      initContainers:
      - name: prepare-data
        image: busybox:1.37.0
        command:
        - sh
        - -ec
        - chown -R 472:472 /data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: datasources
        configMap:
          name: grafana-datasources
  strategy:
    type: Recreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: __KUBE_NAMESPACE__
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: __KUBE_NAMESPACE__
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: true
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo:3200
---
apiVersion: v1
kind: Service
metadata:
  name: loki-headless
  namespace: __KUBE_NAMESPACE__
spec:
  clusterIP: None
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: tempo-headless
  namespace: __KUBE_NAMESPACE__
spec:
  clusterIP: None
  selector:
    app: tempo
  ports:
  - name: http
    port: 3200
    targetPort: http
