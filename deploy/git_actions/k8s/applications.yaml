apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: __KUBE_NAMESPACE__
spec:
  selector: {app: envoy}
  ports:
    - {name: proxy, port: 15001, targetPort: 15001}
    - {name: admin, port: 9901, targetPort: 9901}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 1
  selector: {matchLabels: {app: envoy}}
  template:
    metadata: {labels: {app: envoy}}
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          ports: [{containerPort: 15001}, {containerPort: 9901}]
          volumeMounts:
            - {name: config, mountPath: /etc/envoy, readOnly: true}
      volumes:
        - name: config
          configMap: {name: envoy-config}
