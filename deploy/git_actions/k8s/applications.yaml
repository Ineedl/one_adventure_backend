apiVersion: v1
kind: Service
metadata:
  name: gate-server
  namespace: __KUBE_NAMESPACE__
spec:
  selector: {app: gate-server}
  ports:
    - {name: port-8902, port: 8902, targetPort: 8902}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate-server
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 1
  selector: {matchLabels: {app: gate-server}}
  template:
    metadata: {labels: {app: gate-server}}
    spec:
      containers:
        - name: gate-server
          image: __IMAGE_REPOSITORY__:gate-server-__IMAGE_TAG__
          env: [{name: ETCD_ENDPOINTS, value: etcd:2379}]
          ports:
            - {containerPort: 8902}
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
      volumes:
        - name: config
          secret: {secretName: gate-server-config}
---
