user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format lab '$remote_addr [$time_local] "$request" $status '
                   'upstream=$upstream_addr upstream_status=$upstream_status '
                   'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /var/log/nginx/access.log lab;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream gateway_proxy_nodes {
        least_conn;
        server nginx-node-1:80 max_fails=3 fail_timeout=10s;
        server nginx-node-2:80 max_fails=3 fail_timeout=10s;
        server nginx-node-3:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 'nginx-lb ok\n';
        }

        location / {
            proxy_pass http://gateway_proxy_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
