user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format gateway '$remote_addr [$time_local] "$request" $status '
                       'gateway=$upstream_addr request_time=$request_time '
                       'gateway_time=$upstream_response_time';
    access_log /var/log/nginx/access.log gateway;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream gateway_backend {
        server gateway:8901;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            add_header X-Nginx-Node $hostname always;
            return 200 'nginx-node ok\n';
        }

        location / {
            proxy_pass http://gateway_backend;
            add_header X-Nginx-Node $hostname always;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Nginx-Node $hostname;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
        }
    }
}
