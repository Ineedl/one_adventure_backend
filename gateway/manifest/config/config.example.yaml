# Copy this file to config.yaml and adjust addresses for the deployment environment.
server:
  default:
    address: ":8000"
    openapiPath: "/api.json"
    swaggerPath: "/swagger"
  websocket:
    dumpRouterMap: false

websocket:
  port: 8080
  path: "/ws"
  readBufferSize: 1024
  writeBufferSize: 1024
  maxMessageSize: 65536

rpc:
  gateway:
    port: 8081
    pingInterval: "10s"
    pingTimeout: "3s"

logger:
  level: "all"
  stdout: true
