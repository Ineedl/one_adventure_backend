apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: __KUBE_NAMESPACE__
data:
  01-databases.sql: |
    CREATE DATABASE IF NOT EXISTS test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS one_adventure_user CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS one_adventure_item CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS one_adventure_commerce CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS one_adventure_server CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: __KUBE_NAMESPACE__
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: __KUBE_NAMESPACE__
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: __KUBE_NAMESPACE__
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: __KUBE_NAMESPACE__
spec:
  selector: {app: mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 1
  serviceName: mysql-headless
  selector: {matchLabels: {app: mysql}}
  template:
    metadata: {labels: {app: mysql}}
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: middleware-auth, key: mysql-root-password}
            - {name: MYSQL_ROOT_HOST, value: "%"}
          ports: [{name: mysql, containerPort: 3306}]
          startupProbe:
            exec:
              command: [sh, -ec, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: [sh, -ec, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: mysql}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql, subPath: mysql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: mysql-data}}
        - {name: init, configMap: {name: mysql-init}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: __KUBE_NAMESPACE__
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: __KUBE_NAMESPACE__
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: __KUBE_NAMESPACE__
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: __KUBE_NAMESPACE__
spec:
  replicas: 1
  serviceName: redis-headless
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: [sh, -ec]
          args:
            - 'exec redis-server --appendonly yes --requirepass "$REDISCLI_AUTH"'
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: {name: middleware-auth, key: redis-password}
          ports: [{name: redis, containerPort: 6379}]
          startupProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']}
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: redis-data}}
