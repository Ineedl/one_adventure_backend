server:
  websocket:
    dumpRouterMap: false
websocket:
  port: 8902
  path: "/ws"
  readBufferSize: 1024
  writeBufferSize: 1024
  maxMessageSize: 65536
gateRegistration:
  etcdEndpoints: ["etcd:2379"]
  dialTimeout: "5s"
  envoyAddress: "envoy:15001"
  leaseTtl: 30
  address: ""
  wsPort: 8902
logger:
  level: "all"
  stdout: true
database:
  default:
    link: "mysql:root:12345678@tcp(host.docker.internal:3306)/test"
